<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARS Humanoid/Automotive HMI</title>

    <style>
        .container {
            position: relative;
            width: 98vw;  /* Match your video width */
            height: 100vh; /* Match your video height */
            overflow: hidden;
	        border: 5px solid orange;
            background: rgba(0, 0, 0, 0);
        }

        /* 1. The Video Background */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Sits at the bottom */
        }

        /* 2. The HMI Overlay Container */
        .hmi-overlay {
            position: relative;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 2; /* Sits on top of the video */
            display: flex;
            justify-content: right;
            align-items: center;
            background: transparent; /* Ensures the alpha channel works */
      
        }

        /* 3. Re-enable clicks for the buttons/interactive elements */
        .hmi-overlay button, .hmi-overlay input {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Background Video -->
         
        <video class="bg-video" autoplay loop muted playsinline>
            <source src="DrillVid.1.mp4" type="video/mp4">
        </video>
        

        <!-- HMI Interface Code Goes Here -->
        <div class="hmi-overlay">
            <!-- Insert your HMI layout, graphs, and diagram here -->
		    <iframe src="Generated Interactive Widget_frame_save_x2.htm" style="width: 605px; height: 955px; border: none;" ></iframe>
        </div>
    
    </div>

</body>
</html>
